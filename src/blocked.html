<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube is blocked</title>
    <link rel="stylesheet" href="blocked.css" />
  </head>
  <body>
    <main class="card">
      <div class="badge" aria-hidden="true">CS</div>
      <p class="eyebrow">Colombian Shooter</p>
      <h1>YouTube is blocked for now.</h1>
      <p class="message">
        You made it here on purpose. Take a breath, then decide whether you
        really want to open YouTube.
      </p>
      <button id="continue" type="button">Continue to YouTube</button>
      <p class="hint">You can close this tab if you want to stay focused.</p>
    </main>
    <script src="blocked.js"></script>
  </body>
</html>
