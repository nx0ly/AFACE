<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page paused</title>
    <link rel="stylesheet" href="blocked.css" />
  </head>
  <body>
    <main class="card">
      <section class="panel spend-panel" aria-labelledby="spend-title">
        <div class="panel-content">
          <h1 id="spend-title">Spend 1 token</h1>
          <p class="balance">
            <strong id="token-count">0</strong> tokens available
          </p>
          <p id="whitelist-description" class="description">
            Continue to this site for 30 minutes.
          </p>
          <button id="continue" type="button" disabled>
            Earn 1 token to continue
          </button>
        </div>
      </section>

      <section class="panel earn-panel" aria-labelledby="game-title">
        <div class="panel-content">
          <h2 id="game-title">Get tokens</h2>
          <p class="description">
            More games are coming soon. For now, press the button.
          </p>
          <button id="open-games" class="earn-token" type="button">
            Play games
          </button>
        </div>
      </section>

      <footer class="shop-footer">
        <button id="open-shop" class="shop-button" type="button">
          Open shop
        </button>
      </footer>

    </main>

    <div
      id="wheel-overlay"
      class="wheel-overlay"
      role="dialog"
      aria-label="Wheel of Doom"
      aria-modal="true"
      hidden
    >
      <div class="modal-frame">
        <div class="modal-frame-fill" aria-hidden="true"></div>
        <div class="wheel-content" tabindex="-1">
          <p id="wheel-status" class="wheel-status" aria-live="polite"></p>
          <div class="wheel-stage">
            <div class="wheel-pointer" aria-hidden="true"></div>
            <div
              id="chance-wheel"
              class="chance-wheel"
              role="img"
              aria-label="A wheel split evenly between Safe and Punishment"
            >
              <span class="wheel-option safe-option">Safe</span>
              <span class="wheel-option punishment-option">Punishment</span>
            </div>
          </div>
        </div>
        <div class="frame-edge frame-edge-left" aria-hidden="true"></div>
        <div class="frame-edge frame-edge-right" aria-hidden="true"></div>
        <div class="frame-edge frame-edge-top" aria-hidden="true"></div>
        <div class="frame-edge frame-edge-bottom" aria-hidden="true"></div>
        <img
          class="frame-corner frame-corner-tl"
          src="images/borders/top_left_2.webp"
          alt=""
          draggable="false"
        />
        <img
          class="frame-corner frame-corner-tr"
          src="images/borders/top_right.webp"
          alt=""
          draggable="false"
        />
        <img
          class="frame-corner frame-corner-bl"
          src="images/borders/bottom_left.webp"
          alt=""
          draggable="false"
        />
        <img
          class="frame-corner frame-corner-br"
          src="images/borders/bottom_right_2.webp"
          alt=""
          draggable="false"
        />
      </div>
    </div>

    <script src="blocked.js"></script>
  </body>
</html>
