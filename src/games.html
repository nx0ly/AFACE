<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Pause Games</title>
    <link rel="stylesheet" href="games.css" />
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Page Pause</p>
        <h1>Games</h1>
        <p>Play to earn tokens. More games are coming soon.</p>
      </header>

      <section class="game-grid" aria-label="Available games">
        <a class="game-card tejo" href="minigames/tejo.html">
          <span class="tag">Earn tokens</span>
          <h2>Tejo</h2>
          <p>Score a throw to earn one token.</p>
          <span class="play">Play →</span>
        </a>

        <a class="game-card roulette" href="minigames/roullete_wheel.html">
          <span class="tag">Earn tokens</span>
          <h2>Roulette</h2>
          <p>Land on green to earn one token.</p>
          <span class="play">Spin →</span>
        </a>

        <a class="game-card clicker" href="minigames/mango_clicker.html">
          <span class="tag">Earn tokens</span>
          <h2>Mango Clicker</h2>
          <p>Pick mangos, buy trees, cash the harvest in for tokens.</p>
          <span class="play">Pick →</span>
        </a>
      </section>
    </main>
  </body>
</html>
