<!doctype html>
<html lang="en" class="scheme-dark">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Orange Clicker</title>
        <link rel="stylesheet" href="../theme.css" />
    </head>

    <body
        class="flex min-h-screen select-none items-center justify-center overflow-hidden bg-[radial-gradient(circle_at_center,#ffb52e,#ff7a00_55%,#c83c00)] font-sans text-white"
    >
        <div
            class="flex min-h-screen w-[min(900px,95vw)] flex-col items-center justify-center sm:min-h-[650px]"
        >
            <h1 class="text-[42px] drop-shadow-[0_4px_10px_rgb(0_0_0/0.3)]">
                🍊 Orange Clicker
            </h1>

            <div class="mt-3 text-[30px] font-bold">
                <span id="score">0</span> oranges
            </div>

            <div class="mt-[5px] opacity-80">
                +<span id="power">1</span> per click
            </div>

            <div
                class="relative flex h-[330px] w-[330px] items-center justify-center sm:h-[430px] sm:w-[430px]"
            >
                <div
                    id="cookie"
                    class="relative h-[220px] w-[220px] cursor-pointer touch-manipulation rounded-full border-[12px] border-[#873600] bg-[radial-gradient(circle_at_35%_30%,#ffc45b,#f27a00_65%,#b94200)] shadow-[inset_0_-15px_0_rgb(80_25_0/0.2),0_20px_40px_rgb(70_20_0/0.4)] transition-transform duration-[60ms] active:scale-[0.94] sm:h-[275px] sm:w-[275px]"
                >
                    <span
                        class="absolute top-[65px] left-[45px] h-7 w-7 rounded-full bg-[#713000]"
                    ></span>
                    <span
                        class="absolute top-[45px] left-[120px] h-7 w-7 rounded-full bg-[#713000]"
                    ></span>
                    <span
                        class="absolute top-[85px] right-[48px] h-7 w-7 rounded-full bg-[#713000]"
                    ></span>
                    <span
                        class="absolute bottom-[55px] left-[75px] h-7 w-7 rounded-full bg-[#713000]"
                    ></span>
                    <span
                        class="absolute right-[70px] bottom-[65px] h-7 w-7 rounded-full bg-[#713000]"
                    ></span>
                    <span
                        class="absolute top-[130px] left-[125px] h-7 w-7 rounded-full bg-[#713000]"
                    ></span>
                    <span
                        class="absolute top-[145px] right-[90px] h-7 w-7 rounded-full bg-[#713000]"
                    ></span>
                </div>
            </div>

            <div class="flex gap-[15px]">
                <div
                    class="min-w-[130px] rounded-[14px] border border-white/20 bg-[rgb(100_35_0/0.3)] px-5 py-3 text-center"
                >
                    <strong id="total" class="block text-[20px]">0</strong>
                    total clicks
                </div>

                <div
                    class="min-w-[130px] rounded-[14px] border border-white/20 bg-[rgb(100_35_0/0.3)] px-5 py-3 text-center"
                >
                    <strong id="best" class="block text-[20px]">0</strong>
                    best CPS
                </div>
            </div>

            <div class="mt-3 text-xs opacity-60" id="status">
                Protected input active
            </div>
        </div>
        <script>
            "use strict";

            const cookie = document.getElementById("cookie");
            const scoreDisplay = document.getElementById("score");
            const totalDisplay = document.getElementById("total");
            const bestDisplay = document.getElementById("best");
            const statusDisplay = document.getElementById("status");

            let score = 0;
            let totalClicks = 0;
            let bestCps = 0;

            const POWER = 1;
            const MAX_CPS = 15;
            const clickTimes = [];
            let lastClick = 0;

            function update() {
                scoreDisplay.textContent = Math.floor(score).toLocaleString();
                totalDisplay.textContent = totalClicks.toLocaleString();
                bestDisplay.textContent = bestCps.toFixed(1);
            }

            function effect(event) {
                const rect = cookie.getBoundingClientRect();

                const x = event.clientX - rect.left;
                const y = event.clientY - rect.top;

                const plus = document.createElement("div");

                plus.className =
                    "pointer-events-none absolute animate-float-up text-2xl font-bold";
                plus.textContent = "+" + POWER;
                plus.style.left = x + "px";
                plus.style.top = y + "px";

                cookie.appendChild(plus);

                setTimeout(() => plus.remove(), 700);
            }

            function acceptedClick(event) {
                if (!event.isTrusted) return;
                if (
                    event.pointerType !== "mouse" &&
                    event.pointerType !== "touch" &&
                    event.pointerType !== "pen"
                )
                    return;

                const now = performance.now();

                if (now - lastClick < 45) {
                    statusDisplay.textContent = "Click rate limited";
                    return;
                }

                while (clickTimes.length && now - clickTimes[0] > 1000) {
                    clickTimes.shift();
                }

                if (clickTimes.length >= MAX_CPS) {
                    statusDisplay.textContent = "Click rate limited";
                    return;
                }

                lastClick = now;
                clickTimes.push(now);

                score += POWER;
                totalClicks++;

                if (clickTimes.length > bestCps) {
                    bestCps = clickTimes.length;
                }

                effect(event);
                update();

                statusDisplay.textContent = "Protected input active";
            }

            cookie.addEventListener("pointerdown", acceptedClick);

            cookie.addEventListener("dragstart", (event) => {
                event.preventDefault();
            });

            setInterval(() => {
                if (
                    scoreDisplay.textContent !==
                    Math.floor(score).toLocaleString()
                ) {
                    update();
                }

                if (totalDisplay.textContent !== totalClicks.toLocaleString()) {
                    update();
                }
            }, 250);

            update();
        </script>
    </body>
</html>
