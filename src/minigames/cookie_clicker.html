<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Orange Clicker</title>
        <style>
            * {
                box-sizing: border-box;
                user-select: none;
            }

            body {
                margin: 0;
                min-height: 100vh;
                overflow: hidden;
                display: flex;
                justify-content: center;
                align-items: center;
                font-family: Arial, sans-serif;
                color: white;
                background: radial-gradient(
                    circle at center,
                    #ffb52e,
                    #ff7a00 55%,
                    #c83c00
                );
            }

            .game {
                width: min(900px, 95vw);
                min-height: 650px;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
            }

            h1 {
                margin: 0;
                font-size: 42px;
                text-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            }

            .score {
                margin-top: 12px;
                font-size: 30px;
                font-weight: bold;
            }

            .rate {
                margin-top: 5px;
                opacity: 0.8;
            }

            .cookie-area {
                width: 430px;
                height: 430px;
                display: flex;
                justify-content: center;
                align-items: center;
                position: relative;
            }

            .cookie {
                width: 275px;
                height: 275px;
                border-radius: 50%;
                border: 12px solid #873600;
                background: radial-gradient(
                    circle at 35% 30%,
                    #ffc45b,
                    #f27a00 65%,
                    #b94200
                );
                box-shadow:
                    inset 0 -15px 0 rgba(80, 25, 0, 0.2),
                    0 20px 40px rgba(70, 20, 0, 0.4);
                position: relative;
                cursor: pointer;
                touch-action: manipulation;
                transition: transform 0.06s;
            }

            .cookie:active {
                transform: scale(0.94);
            }

            .chip {
                position: absolute;
                width: 28px;
                height: 28px;
                border-radius: 50%;
                background: #713000;
            }

            .c1 {
                left: 45px;
                top: 65px;
            }
            .c2 {
                left: 120px;
                top: 45px;
            }
            .c3 {
                right: 48px;
                top: 85px;
            }
            .c4 {
                left: 75px;
                bottom: 55px;
            }
            .c5 {
                right: 70px;
                bottom: 65px;
            }
            .c6 {
                left: 125px;
                top: 130px;
            }
            .c7 {
                right: 90px;
                top: 145px;
            }

            .plus {
                position: absolute;
                font-size: 24px;
                font-weight: bold;
                pointer-events: none;
                animation: floatUp 0.7s ease-out forwards;
            }

            @keyframes floatUp {
                from {
                    opacity: 1;
                    transform: translateY(0);
                }
                to {
                    opacity: 0;
                    transform: translateY(-80px);
                }
            }

            .stats {
                display: flex;
                gap: 15px;
            }

            .stat {
                min-width: 130px;
                padding: 12px 20px;
                text-align: center;
                border-radius: 14px;
                background: rgba(100, 35, 0, 0.3);
                border: 1px solid rgba(255, 255, 255, 0.2);
            }

            .stat strong {
                display: block;
                font-size: 20px;
            }

            .status {
                margin-top: 12px;
                font-size: 12px;
                opacity: 0.6;
            }

            @media (max-width: 600px) {
                .cookie-area {
                    width: 330px;
                    height: 330px;
                }

                .cookie {
                    width: 220px;
                    height: 220px;
                }

                .game {
                    min-height: 100vh;
                }
            }
        </style>
    </head>

    <body>
        <div class="game">
            <h1>🍊 Orange Clicker</h1>

            <div class="score"><span id="score">0</span> oranges</div>

            <div class="rate">+<span id="power">1</span> per click</div>

            <div class="cookie-area">
                <div id="cookie" class="cookie">
                    <span class="chip c1"></span>
                    <span class="chip c2"></span>
                    <span class="chip c3"></span>
                    <span class="chip c4"></span>
                    <span class="chip c5"></span>
                    <span class="chip c6"></span>
                    <span class="chip c7"></span>
                </div>
            </div>

            <div class="stats">
                <div class="stat">
                    <strong id="total">0</strong>
                    total clicks
                </div>

                <div class="stat">
                    <strong id="best">0</strong>
                    best CPS
                </div>
            </div>

            <div class="status" id="status">Protected input active</div>
        </div>

        <script>
            "use strict";

            const cookie = document.getElementById("cookie");
            const scoreDisplay = document.getElementById("score");
            const totalDisplay = document.getElementById("total");
            const bestDisplay = document.getElementById("best");
            const statusDisplay = document.getElementById("status");

            let score = 0;
            let totalClicks = 0;
            let bestCps = 0;

            const POWER = 1;
            const MAX_CPS = 15;
            const clickTimes = [];
            let lastClick = 0;

            function update() {
                scoreDisplay.textContent = Math.floor(score).toLocaleString();
                totalDisplay.textContent = totalClicks.toLocaleString();
                bestDisplay.textContent = bestCps.toFixed(1);
            }

            function effect(event) {
                const rect = cookie.getBoundingClientRect();

                const x = event.clientX - rect.left;
                const y = event.clientY - rect.top;

                const plus = document.createElement("div");

                plus.className = "plus";
                plus.textContent = "+" + POWER;
                plus.style.left = x + "px";
                plus.style.top = y + "px";

                cookie.appendChild(plus);

                setTimeout(() => plus.remove(), 700);
            }

            function acceptedClick(event) {
                if (!event.isTrusted) return;
                if (
                    event.pointerType !== "mouse" &&
                    event.pointerType !== "touch" &&
                    event.pointerType !== "pen"
                )
                    return;

                const now = performance.now();

                if (now - lastClick < 45) {
                    statusDisplay.textContent = "Click rate limited";
                    return;
                }

                while (clickTimes.length && now - clickTimes[0] > 1000) {
                    clickTimes.shift();
                }

                if (clickTimes.length >= MAX_CPS) {
                    statusDisplay.textContent = "Click rate limited";
                    return;
                }

                lastClick = now;
                clickTimes.push(now);

                score += POWER;
                totalClicks++;

                if (clickTimes.length > bestCps) {
                    bestCps = clickTimes.length;
                }

                effect(event);
                update();

                statusDisplay.textContent = "Protected input active";
            }

            cookie.addEventListener("pointerdown", acceptedClick);

            cookie.addEventListener("dragstart", (event) => {
                event.preventDefault();
            });

            setInterval(() => {
                if (
                    scoreDisplay.textContent !==
                    Math.floor(score).toLocaleString()
                ) {
                    update();
                }

                if (totalDisplay.textContent !== totalClicks.toLocaleString()) {
                    update();
                }
            }, 250);

            update();
        </script>
    </body>
</html>
