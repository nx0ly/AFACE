<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>128 Slot Color Roulette</title>

        <style>
            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;

                background: radial-gradient(
                    circle at center,
                    #252525 0%,
                    #0c0c0c 70%
                );

                font-family: Arial, Helvetica, sans-serif;
                color: white;
            }

            .game {
                text-align: center;
            }

            h1 {
                margin: 0 0 35px;

                font-size: 26px;
                letter-spacing: 5px;
                font-weight: 800;

                color: #eee;
            }

            .wheel-wrapper {
                position: relative;

                width: 430px;
                height: 430px;

                margin: auto;
            }

            .pointer {
                position: absolute;

                top: -12px;
                left: 50%;

                transform: translateX(-50%);

                z-index: 20;

                width: 0;
                height: 0;

                border-left: 17px solid transparent;
                border-right: 17px solid transparent;
                border-top: 38px solid #f4f4f4;

                filter: drop-shadow(0 3px 3px rgba(0, 0, 0, 0.8));
            }

            .wheel-rim {
                position: absolute;

                inset: 0;

                border-radius: 50%;

                padding: 11px;

                background: linear-gradient(
                    135deg,
                    #f5d879,
                    #8c6420 25%,
                    #e5bd50 50%,
                    #79541b 75%,
                    #edcb68
                );

                box-shadow:
                    0 20px 50px rgba(0, 0, 0, 0.65),
                    inset 0 0 8px rgba(255, 255, 255, 0.7);
            }

            .wheel {
                position: relative;

                width: 100%;
                height: 100%;

                border-radius: 50%;

                overflow: hidden;

                background: #111;

                transition: transform 5.5s cubic-bezier(0.12, 0.72, 0.13, 1);

                box-shadow:
                    inset 0 0 0 4px #222,
                    inset 0 0 30px rgba(0, 0, 0, 0.8);
            }

            .slot-lines {
                position: absolute;

                inset: 0;

                border-radius: 50%;

                background: repeating-conic-gradient(
                    from 0deg,
                    transparent 0deg 2.7deg,
                    rgba(255, 255, 255, 0.2) 2.7deg 2.8125deg
                );

                pointer-events: none;

                z-index: 3;
            }

            .inner-ring {
                position: absolute;

                inset: 17%;

                border-radius: 50%;

                border: 4px solid rgba(210, 165, 65, 0.9);

                box-shadow:
                    inset 0 0 0 4px #171717,
                    0 0 10px rgba(0, 0, 0, 0.5);

                pointer-events: none;

                z-index: 4;
            }

            .center {
                position: absolute;

                width: 105px;
                height: 105px;

                left: 50%;
                top: 50%;

                transform: translate(-50%, -50%);

                border-radius: 50%;

                background: radial-gradient(
                    circle,
                    #444 0%,
                    #222 45%,
                    #090909 100%
                );

                border: 7px solid #a77a26;

                box-shadow:
                    0 5px 15px rgba(0, 0, 0, 0.7),
                    inset 0 0 15px rgba(255, 255, 255, 0.08);

                z-index: 10;
            }

            .center::after {
                content: "";

                position: absolute;

                width: 18px;
                height: 18px;

                left: 50%;
                top: 50%;

                transform: translate(-50%, -50%);

                border-radius: 50%;

                background: #d7d7d7;

                box-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
            }

            .result {
                margin-top: 35px;

                height: 65px;
            }

            .result-label {
                font-size: 11px;

                letter-spacing: 4px;

                color: #777;
            }

            #result {
                margin-top: 7px;

                font-size: 28px;
                font-weight: 800;

                letter-spacing: 3px;
            }

            #spin {
                margin-top: 15px;

                padding: 15px 60px;

                border: none;
                border-radius: 50px;

                background: linear-gradient(180deg, #f5f5f5, #cfcfcf);

                color: #111;

                font-size: 15px;
                font-weight: 800;

                letter-spacing: 3px;

                cursor: pointer;

                box-shadow: 0 7px 20px rgba(0, 0, 0, 0.4);

                transition:
                    transform 0.15s,
                    box-shadow 0.15s;
            }

            #spin:hover {
                transform: translateY(-2px);

                box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            }

            #spin:active {
                transform: translateY(1px);
            }

            #spin:disabled {
                opacity: 0.5;
                cursor: not-allowed;
            }

            .legend {
                margin-top: 25px;

                display: flex;
                justify-content: center;
                gap: 22px;

                font-size: 12px;

                color: #888;
            }

            .legend-item {
                display: flex;
                align-items: center;
                gap: 7px;
            }

            .dot {
                width: 9px;
                height: 9px;

                border-radius: 50%;
            }

            .red {
                background: #c62828;
            }

            .black {
                background: #111;
                border: 1px solid #555;
            }

            .green {
                background: #16a05a;
            }

            @media (max-width: 520px) {
                .wheel-wrapper {
                    width: 320px;
                    height: 320px;
                }

                h1 {
                    font-size: 20px;
                    margin-bottom: 25px;
                }

                .center {
                    width: 80px;
                    height: 80px;
                }

                .result {
                    margin-top: 25px;
                }
            }
        </style>
    </head>

    <body>
        <div class="game">
            <h1>COLOR ROULETTE</h1>

            <div class="wheel-wrapper">
                <div class="pointer"></div>

                <div class="wheel-rim">
                    <div class="wheel" id="wheel">
                        <div class="slot-lines"></div>

                        <div class="inner-ring"></div>

                        <div class="center"></div>
                    </div>
                </div>
            </div>

            <div class="result">
                <div class="result-label">RESULT</div>

                <div id="result">-</div>
            </div>

            <button id="spin">SPIN</button>

            <div class="legend">
                <div class="legend-item">
                    <span class="dot red"></span>
                    RED
                </div>

                <div class="legend-item">
                    <span class="dot black"></span>
                    BLACK
                </div>

                <div class="legend-item">
                    <span class="dot green"></span>
                    GREEN
                </div>
            </div>
        </div>

        <script src="roullete_wheel.js"></script>
    </body>
</html>
