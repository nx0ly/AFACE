<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Tejo • Colombia</title>

        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #222;
                overflow: hidden;
                font-family: Arial, sans-serif;
            }

            canvas {
                width: min(1200px, 96vw);
                height: auto;
                background: #c9a66b;
                border: 2px solid #111;
                touch-action: none;
                cursor: grab;
            }

            canvas.dragging {
                cursor: grabbing;
            }
        </style>
    </head>

    <body>
        <canvas id="canvas" width="1200" height="650"></canvas>

        <script src="tejo.js"></script>
    </body>
</html>
