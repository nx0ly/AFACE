            :root {

            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                min-height: 100vh;
                background: linear-gradient(135deg, #fff7ed, #fed7aa);
                font-family:
                    system-ui,
                    -apple-system,
                    Segoe UI,
                    sans-serif;
                color: var(--ink);
                display: grid;
                place-items: center;
                padding: 20px;
            }
            .game {
                width: min(760px, 100%);
            }
            .header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 18px;
            }
            .logo {
                font-size: 28px;
                font-weight: 950;
            }
            .logo span {
                color: var(--o);
            }
            .tokens {
                background: white;
                border: 2px solid #fdba74;
                border-radius: 999px;
                padding: 9px 16px;
                font-weight: 900;
                box-shadow: 0 6px 20px #9a341220;
            }
            .card {
                background: #fff;
                border: 2px solid #fdba74;
                border-radius: 26px;
                padding: clamp(24px, 5vw, 44px);
                box-shadow: 0 25px 70px #9a341225;
            }
            .number {
                color: var(--o2);
                font-size: 13px;
                font-weight: 900;
                text-transform: uppercase;
                letter-spacing: 2px;
                margin-bottom: 12px;
            }
            h1 {
                font-size: clamp(25px, 5vw, 39px);
                line-height: 1.12;
                margin: 0 0 25px;
            }
            .answers {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 14px;
            }
            .answer {
                min-height: 76px;
                border: 2px solid #fed7aa;
                background: var(--bg);
                border-radius: 17px;
                padding: 16px;
                text-align: left;
                font: inherit;
                font-size: 16px;
                font-weight: 800;
                color: var(--ink);
                cursor: pointer;
                transition: 0.15s;
            }
            .answer:hover {
                border-color: var(--o);
                transform: translateY(-2px);
            }
            .answer.correct {
                background: #dcfce7;
                border-color: #16a34a;
                color: #14532d;
            }
            .answer.wrong {
                background: #fee2e2;
                border-color: #dc2626;
                color: #7f1d1d;
            }
            .answer:disabled {
                cursor: default;
            }
            .end {
                display: none;
                text-align: center;
            }
            .end h2 {
                font-size: 38px;
                margin: 0 0 8px;
            }
            .end p {
                font-weight: 700;
                color: #9a3412;
            }
            .restart {
                border: 0;
                background: var(--o2);
                color: white;
                padding: 13px 20px;
                border-radius: 14px;
                font: inherit;
                font-weight: 900;
                cursor: pointer;
            }
            @media (max-width: 600px) {
                .answers {
                    grid-template-columns: 1fr;
                }
                .header {
                    margin-bottom: 12px;
                }
            }
        </style>
    </head>

            function answer(i) {
                const q = QUESTIONS[index];
                const buttons = [...document.querySelectorAll(".answer")];
                buttons.forEach((b) => (b.disabled = true));
                if (i !== q.answer) {
                    buttons[q.answer].classList.add("correct");
                    setTimeout(endGame, 450);
                    return;

                buttons[i].classList.add("correct");
                tokens += 10;
                localStorage.setItem("colombiaTokens", tokens);
                tokenEl.textContent = tokens;
                index++;
                setTimeout(
                    () => (index < QUESTIONS.length ? show() : endGame()),
                    350,
                );
            }

                document.getElementById("quiz").style.display = "none";
