<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Page paused</title>
        <link rel="stylesheet" href="../theme.css" />
        <style>
            body {
                background-color: var(--color-parchment);
                background-image: url("/images/diomedes.jpg");
                background-size: cover;
                background-attachment: fixed;
                color: var(--color-brown);
                font-family: "Times New Roman", Times, serif;
                margin: 0;
                padding: 0 24px;
                box-sizing: border-box;
                overflow-x: hidden;
            }
            .retro-container {
                width: 100%;
                max-width: 800px;
                box-sizing: border-box;
                margin: 40px auto;
                background-color: var(--color-cream);
                border: 5px outset var(--color-brown);
                padding: 20px;
                text-align: center;
                box-shadow: 10px 10px 0px #000;
            }
            h1 {
                font-size: clamp(16px, 3.2vw, 28px);
                color: #ff0000;
                text-decoration: underline;
                margin: 0;
                white-space: nowrap;
            }
            .btn-retro {
                background-color: var(--color-sun);
                color: var(--color-soot-900);
                border: 4px outset #ffcc00;
                padding: 10px 20px;
                font-size: 18px;
                font-weight: bold;
                font-family: "Comic Sans MS", "Comic Sans", cursive;
                cursor: pointer;
                margin: 20px 0;
            }
            .btn-retro:active {
                border-style: inset;
            }
            .btn-retro:disabled {
                background-color: #cccccc;
                border-color: #999999;
                color: #666666;
                cursor: not-allowed;
            }
            table {
                margin: 0 auto;
                border: 3px solid var(--color-brown);
                background-color: var(--color-sun);
            }
            td {
                border: 1px solid var(--color-brown);
                padding: 10px;
                font-weight: bold;
            }
            hr {
                border: 0;
                border-bottom: 3px dashed var(--color-brown);
                margin: 20px 0;
            }
            a {
                color: #0000ee;
                text-decoration: underline;
            }
            a:visited {
                color: #551a8b;
            }

            .falling-arepa {
                position: fixed;
                top: -100px;
                width: 64px;
                height: 64px;
                background-image: url("/images/arepa.png");
                background-size: cover;
                animation: fall linear infinite;
                z-index: 1000;
                pointer-events: none;
                image-rendering: pixelated;
            }
            @keyframes fall {
                0% {
                    transform: translateY(-100px) rotate(0deg);
                }
                100% {
                    transform: translateY(110vh) rotate(360deg);
                }
            }

            #randomizer-overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.8);
                display: flex;
                justify-content: center;
                align-items: center;
                z-index: 2000;
            }
            .randomizer-box {
                background: blue;
                color: yellow;
                border: 10px groove grey;
                padding: 40px;
                text-align: center;
                font-family: "Courier New", Courier, monospace;
                font-size: 32px;
                font-weight: bold;
                width: 500px;
            }
            .hidden {
                display: none !important;
            }
            .blink {
                animation: blinker 0.2s linear infinite;
            }
            @keyframes blinker {
                50% {
                    opacity: 0;
                }
            }

            #games-btn {
                display: inline-block;
                font-size: 30px;
                color: #ff00ff;
                background-color: yellow;
                border: 5px dashed red;
                padding: 15px;
                text-decoration: none;
                animation: neon-flash 0.5s infinite;
            }
            @keyframes neon-flash {
                0% {
                    background-color: yellow;
                    color: red;
                    transform: scale(1);
                }
                50% {
                    background-color: cyan;
                    color: magenta;
                    transform: scale(1.1);
                }
                100% {
                    background-color: lime;
                    color: blue;
                    transform: scale(1);
                }
            }
        </style>
    </head>
