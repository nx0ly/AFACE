<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Pause Games</title>
    <link rel="stylesheet" href="../theme.css" />
    <style>
      body {
        background-color: var(--color-parchment);
        color: var(--color-brown);
        font-family: "Comic Sans MS", "Times New Roman", serif;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }
      .retro-container {
        width: 800px;
        margin: 40px auto;
        background-color: var(--color-cream);
        border: 5px outset var(--color-brown);
        padding: 20px;
        text-align: center;
        box-shadow: 10px 10px 0px #000;
      }
      h1 {
        font-size: 32px;
        color: #ff0000;
        text-decoration: underline;
      }
      a {
        color: #0000ee;
        text-decoration: underline;
        font-weight: bold;
        font-size: 24px;
        display: block;
        margin: 20px 0;
      }
      a:hover {
        background-color: yellow;
      }
      a:visited {
        color: #551a8b;
      }
      hr {
        border: 0;
        border-bottom: 3px dashed var(--color-brown);
        margin: 20px 0;
      }
      
      /* Falling Arepas Animation */
      .falling-arepa {
        position: fixed;
        top: -100px;
        width: 64px;
        height: 64px;
        background-image: url('/images/arepa.png');
        background-size: cover;
        animation: fall linear infinite;
        z-index: 1000;
        pointer-events: none;
        image-rendering: pixelated;
      }
      @keyframes fall {
        0% { transform: translateY(-100px) rotate(0deg); }
        100% { transform: translateY(110vh) rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <!-- Falling Arepas -->
    <div class="falling-arepa" style="left: 5%; animation-duration: 4s; animation-delay: 0s;"></div>
    <div class="falling-arepa" style="left: 15%; animation-duration: 5s; animation-delay: 1s;"></div>
    <div class="falling-arepa" style="left: 10%; animation-duration: 3.5s; animation-delay: 2.5s;"></div>
    <div class="falling-arepa" style="right: 5%; animation-duration: 4.5s; animation-delay: 0.5s;"></div>
    <div class="falling-arepa" style="right: 15%; animation-duration: 3.8s; animation-delay: 1.5s;"></div>
    <div class="falling-arepa" style="right: 10%; animation-duration: 5.2s; animation-delay: 3s;"></div>

    <div class="retro-container">
      <marquee scrollamount="10" behavior="alternate">
        <h1>*** PLAY GAMES TO EARN COFFEE BEANS ***</h1>
      </marquee>
      
      <hr />
      
      <h2>CHOOSE A GAME:</h2>
      
      <a href="minigames/tejo.html">1. TEJO (Earn 1 Bean per hit!)</a>
      
      <a href="minigames/roullete_wheel.html">2. COLOR ROULETTE (Gamble your beans!)</a>
      
      <a href="minigames/adivina.html">3. ADIVINA (Guess the number!)</a>

      <hr />
      
      <p style="font-size: 14px; color: #666;">Page Pause 2026 - All Rights Reserved.</p>
    </div>
  </body>
</html>
