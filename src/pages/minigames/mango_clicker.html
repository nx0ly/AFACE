<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Mango Clicker • Macondo</title>

        <style>
            * {
                box-sizing: border-box;
                user-select: none;
            }

            body {
                margin: 0;
                min-height: 100vh;
                padding: clamp(20px, 4vw, 44px);
                display: flex;
                justify-content: center;
                align-items: center;
                font-family: Inter, ui-sans-serif, system-ui, sans-serif;
                color: #684d3a;
                background: #eacfb3;
                overflow-x: hidden;
            }

            .game {
                width: min(1040px, 100%);
                display: grid;
                gap: 22px;
                grid-template-columns: minmax(0, 1.15fr) minmax(280px, 0.85fr);
                align-items: start;
            }

            .panel {
                background: #f6e5c7;
                border: 3px solid #684d3a;
                border-radius: 20px;
                box-shadow: 8px 8px 0 rgb(104 77 58 / 18%);
                padding: 24px;
            }

            .eyebrow {
                font-size: 13px;
                font-weight: 900;
                letter-spacing: 0.14em;
                margin: 0 0 6px;
                text-transform: uppercase;
            }

            h1 {
                font-size: clamp(34px, 5vw, 52px);
                letter-spacing: -0.06em;
                line-height: 0.95;
                margin: 0;
            }

            .score {
                font-size: clamp(38px, 6vw, 60px);
                font-weight: 900;
                letter-spacing: -0.05em;
                line-height: 1;
                margin: 18px 0 2px;
            }

            .score-label,
            .rate {
                color: rgb(104 77 58 / 72%);
                font-size: 15px;
                margin: 0;
            }

            .orchard {
                position: relative;
                display: flex;
                justify-content: center;
                align-items: center;
                margin: 14px 0 6px;
                min-height: 320px;
            }

            .mango {
                width: min(280px, 62vw);
                background: none;
                border: 0;
                padding: 0;
                cursor: pointer;
                touch-action: manipulation;
                transition: transform 90ms ease;
                filter: drop-shadow(0 18px 22px rgb(104 77 58 / 32%));
            }

            .mango:hover {
                transform: scale(1.03) rotate(-1.5deg);
            }

            .mango.squish {
                transform: scale(0.9) rotate(2deg);
            }

            .mango svg,
            .mango img {
                display: block;
                width: 100%;
                height: auto;
                pointer-events: none;
            }

            .combo {
                position: absolute;
                top: 4px;
                right: 4px;
                background: #f2bf40;
                border: 3px solid #684d3a;
                border-radius: 999px;
                font-size: 18px;
                font-weight: 900;
                padding: 6px 14px;
                opacity: 0;
                transform: scale(0.7);
                transition:
                    opacity 140ms ease,
                    transform 140ms ease;
            }

            .combo.on {
                opacity: 1;
                transform: scale(1);
            }

            .pop {
                position: absolute;
                font-size: 26px;
                font-weight: 900;
                pointer-events: none;
                animation: floatUp 850ms cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
            }

            .splash {
                position: absolute;
                width: 12px;
                height: 12px;
                border-radius: 50%;
                background: #f2bf40;
                pointer-events: none;
                animation: burst 620ms ease-out forwards;
            }

            @keyframes floatUp {
                from {
                    opacity: 1;
                    transform: translate(-50%, 0) scale(1);
                }
                to {
                    opacity: 0;
                    transform: translate(-50%, -96px) scale(1.25);
                }
            }

            @keyframes burst {
                from {
                    opacity: 1;
                    transform: translate(-50%, -50%) scale(1);
                }
                to {
                    opacity: 0;
                    transform: translate(
                            calc(-50% + var(--dx)),
                            calc(-50% + var(--dy))
                        )
                        scale(0.2);
                }
            }

            .stats {
                display: grid;
                gap: 10px;
                grid-template-columns: repeat(3, 1fr);
            }

            .stat {
                background: #eacfb3;
                border: 2px solid rgb(104 77 58 / 35%);
                border-radius: 14px;
                padding: 10px 12px;
                text-align: center;
            }

            .stat strong {
                display: block;
                font-size: 22px;
                letter-spacing: -0.03em;
            }

            .stat span {
                color: rgb(104 77 58 / 72%);
                font-size: 12px;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.08em;
            }

            h2 {
                font-size: 26px;
                letter-spacing: -0.04em;
                margin: 0 0 4px;
            }

            .hint {
                color: rgb(104 77 58 / 72%);
                font-size: 14px;
                margin: 0 0 16px;
            }

            .token-bar {
                background: #eacfb3;
                border: 2px solid #684d3a;
                border-radius: 999px;
                height: 14px;
                overflow: hidden;
                margin: 8px 0 20px;
            }

            .token-fill {
                background: #f2bf40;
                height: 100%;
                width: 0%;
                transition: width 220ms ease;
            }

            .upgrades {
                display: grid;
                gap: 12px;
            }

            .upgrade {
                background: #eacfb3;
                border: 3px solid #684d3a;
                border-radius: 16px;
                color: inherit;
                cursor: pointer;
                display: grid;
                gap: 2px;
                font: inherit;
                padding: 14px 16px;
                text-align: left;
                transition: opacity 120ms ease;
            }

            .upgrade:disabled {
                cursor: not-allowed;
                opacity: 0.45;
            }

            .upgrade-top {
                display: flex;
                justify-content: space-between;
                align-items: baseline;
                gap: 10px;
            }

            .upgrade-name {
                font-size: 18px;
                font-weight: 900;
            }

            .upgrade-cost {
                font-weight: 900;
                white-space: nowrap;
            }

            .upgrade-desc {
                color: rgb(104 77 58 / 72%);
                font-size: 13px;
            }

            .upgrade-owned {
                font-size: 12px;
                font-weight: 700;
                letter-spacing: 0.08em;
                text-transform: uppercase;
            }

            .status {
                color: rgb(104 77 58 / 60%);
                font-size: 12px;
                margin: 16px 0 0;
                min-height: 16px;
            }

            .back {
                color: inherit;
                font-weight: 900;
                text-decoration: none;
            }

            .back:hover {
                text-decoration: underline;
            }

            @media (max-width: 860px) {
                .game {
                    grid-template-columns: 1fr;
                }
            }

            @media (prefers-reduced-motion: reduce) {
                .mango,
                .pop,
                .splash,
                .combo {
                    animation: none;
                    transition: none;
                }
            }
        </style>
    </head>

    <body>
        <main class="game">
            <section class="panel">
                <p class="eyebrow">Page Pause</p>
                <h1>Mango Clicker</h1>

                <p class="score"><span id="score">0</span></p>
                <p class="score-label">mangos in the basket</p>
                <p class="rate">
                    +<span id="power">1</span> per pick ·
                    <span id="persec">0</span>/sec from the grove
                </p>

                <div class="orchard">
                    <button
                        id="mango"
                        class="mango"
                        type="button"
                        aria-label="Pick a mango"
                    >
                        <!-- Fallback art. If ../../images/mango.png exists, the
                             script swaps it in automatically. -->
                        <svg viewBox="0 0 220 240" aria-hidden="true">
                            <path
                                d="M110 26c8-14 24-22 40-22-2 16-12 29-26 35"
                                fill="#5c8a3a"
                                stroke="#684d3a"
                                stroke-width="7"
                                stroke-linejoin="round"
                            />
                            <path
                                d="M110 30c6-10 14-16 22-16"
                                fill="none"
                                stroke="#684d3a"
                                stroke-width="7"
                                stroke-linecap="round"
                            />
                            <path
                                d="M143 52c34 22 48 66 33 108-15 42-56 68-95 60-38-8-63-46-56-90 7-45 45-84 88-88 12-1 21 3 30 10z"
                                fill="url(#flesh)"
                                stroke="#684d3a"
                                stroke-width="8"
                                stroke-linejoin="round"
                            />
                            <ellipse
                                cx="82"
                                cy="106"
                                rx="20"
                                ry="30"
                                fill="#fff3cf"
                                opacity="0.55"
                                transform="rotate(-24 82 106)"
                            />
                            <defs>
                                <radialGradient id="flesh" cx="34%" cy="28%">
                                    <stop offset="0%" stop-color="#ffe066" />
                                    <stop offset="45%" stop-color="#f7a726" />
                                    <stop offset="100%" stop-color="#d94f1e" />
                                </radialGradient>
                            </defs>
                        </svg>
                    </button>

                    <div class="combo" id="combo">x1.0</div>
                </div>

                <div class="stats">
                    <div class="stat">
                        <strong id="lifetime">0</strong>
                        <span>harvested</span>
                    </div>
                    <div class="stat">
                        <strong id="clicks">0</strong>
                        <span>picks</span>
                    </div>
                    <div class="stat">
                        <strong id="tokens">0</strong>
                        <span>tokens paid</span>
                    </div>
                </div>

                <p class="status" id="status"></p>
            </section>

            <section class="panel">
                <h2>The finca</h2>
                <p class="hint" id="token-hint">
                    Every 5,000 mangos harvested pays out 1 token — enough to
                    escape one punishment.
                </p>
                <div class="token-bar">
                    <div class="token-fill" id="token-fill"></div>
                </div>

                <div class="upgrades" id="upgrades"></div>

                <p class="status">
                    <a class="back" href="../games.html">← Back to games</a>
                </p>
            </section>
        </main>

        <script src="mango_clicker.js"></script>
    </body>
</html>
