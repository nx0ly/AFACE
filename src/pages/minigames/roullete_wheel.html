<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Color Roulette</title>
        <link rel="stylesheet" href="../../theme.css" />
        <style>
            body {
                background-color: var(--color-parchment);
                background-image: url("/images/diomedes.jpg");
                background-size: cover;
                background-attachment: fixed;
                color: var(--color-brown);
                font-family: "Times New Roman", Times, serif;
                margin: 0;
                padding: 20px;
                text-align: center;
                overflow-x: hidden;
            }
            h1 {
                color: #ffcc00;
                text-decoration: underline;
                font-size: 32px;
            }
            .retro-box {
                border: 5px solid #aaaaaa;
                background-color: #222222;
                padding: 20px;
                width: 700px;
                margin: 0 auto;
                position: relative;
                z-index: 20;
            }
            .wheel-container {
                margin: 20px auto;
                width: 500px;
                height: 500px;
                border: 15px ridge #bbbbbb;
                border-radius: 50%;
                position: relative;
                overflow: hidden;
            }
            #wheel {
                width: 100%;
                height: 100%;
                transition: transform 5.5s cubic-bezier(0.12, 0.72, 0.13, 1);
            }
            .pointer {
                position: absolute;
                top: -20px;
                left: 230px;
                width: 0;
                height: 0;
                border-left: 20px solid transparent;
                border-right: 20px solid transparent;
                border-top: 50px solid silver;
                filter: drop-shadow(0px 5px 5px rgba(0, 0, 0, 0.8));
                z-index: 10;
            }
            .btn-retro {
                background-color: #aaaaaa;
                color: #000000;
                border: 3px outset #dddddd;
                padding: 10px 20px;
                font-size: 16px;
                font-weight: bold;
                font-family: "Courier New", Courier, monospace;
                cursor: pointer;
            }
            .btn-retro:active {
                border-style: inset;
            }
            .btn-retro:disabled {
                background-color: #555555;
                color: #888888;
                border-color: #444444;
            }
            .color-btn {
                background-color: #444444;
                color: white;
                border: 3px outset #777777;
                padding: 10px 15px;
                cursor: pointer;
                font-family: "Courier New", Courier, monospace;
                font-weight: bold;
            }
            .color-btn[data-selected="true"] {
                border-style: inset;
                color: black;
            }
            #btn-yellow {
                border-color: yellow;
            }
            #btn-yellow[data-selected="true"] {
                background-color: yellow;
            }
            #btn-blue {
                border-color: #0000ff;
            }
            #btn-blue[data-selected="true"] {
                background-color: #0000ff;
                color: white;
            }
            #btn-red {
                border-color: red;
            }
            #btn-red[data-selected="true"] {
                background-color: red;
                color: white;
            }

            input[type="number"] {
                border: 3px inset #aaaaaa;
                background-color: #ffffff;
                color: #000000;
                padding: 5px;
                font-size: 16px;
                font-weight: bold;
                width: 100px;
                font-family: "Courier New", Courier, monospace;
            }
            table {
                margin: 0 auto;
                border-collapse: collapse;
            }
            td {
                padding: 10px;
            }
            #result {
                font-size: 24px;
                font-weight: bold;
                margin: 20px 0;
                min-height: 30px;
            }

            /* Falling Arepas Animation */
            .falling-arepa {
                position: fixed;
                top: -100px;
                width: 64px;
                height: 64px;
                background-image: url("/images/arepa.png");
                background-size: cover;
                animation: fall linear infinite;
                z-index: 10;
                pointer-events: none;
                image-rendering: pixelated;
            }
            @keyframes fall {
                0% {
                    transform: translateY(-100px) rotate(0deg);
                }
                100% {
                    transform: translateY(110vh) rotate(360deg);
                }
            }
        </style>
    </head>

    <body>
        <div
            class="falling-arepa"
            style="left: 5%; animation-duration: 4s; animation-delay: 0s"
        ></div>
        <div
            class="falling-arepa"
            style="left: 15%; animation-duration: 5s; animation-delay: 1s"
        ></div>
        <div
            class="falling-arepa"
            style="left: 10%; animation-duration: 3.5s; animation-delay: 2.5s"
        ></div>
        <div
            class="falling-arepa"
            style="right: 5%; animation-duration: 4.5s; animation-delay: 0.5s"
        ></div>
        <div
            class="falling-arepa"
            style="right: 15%; animation-duration: 3.8s; animation-delay: 1.5s"
        ></div>
        <div
            class="falling-arepa"
            style="right: 10%; animation-duration: 5.2s; animation-delay: 3s"
        ></div>

        <!-- DVD Bouncing Ads -->
        <img
            id="ad-roul-1"
            src="/images/hot_capy_ad.jpg"
            alt="Ad"
            style="position: absolute; width: 250px; z-index: 100"
        />
        <img
            id="ad-roul-2"
            src="/images/ad_tejo.png"
            alt="Ad"
            style="position: absolute; width: 150px; z-index: 100"
        />
        <img
            id="ad-roul-3"
            src="/images/arepa.png"
            alt="Ad"
            style="position: absolute; width: 100px; z-index: 100"
        />

        <div class="retro-box">
            <marquee scrollamount="5">
                <h1>*** COLOR ROULETTE ***</h1>
            </marquee>

            <div class="wheel-container">
                <div class="pointer"></div>
                <div id="wheel"></div>
            </div>

            <div id="result">--</div>

            <hr size="3" color="#aaaaaa" />

            <table>
                <tr>
                    <td><b>BET (BEANS):</b></td>
                    <td>
                        <input
                            type="number"
                            id="bet-amount"
                            value="1"
                            min="1"
                        />
                    </td>
                </tr>
            </table>

            <br />

            <button id="btn-yellow" class="color-btn">YELLOW</button>
            <button id="btn-blue" class="color-btn">BLUE</button>
            <button id="btn-red" class="color-btn">RED</button>

            <br /><br />
            <button id="spin" class="btn-retro">SPIN THE WHEEL!</button>

            <br /><br />
            <hr size="3" color="#aaaaaa" />
            <b>BALANCE: <span id="balance">0</span> BEANS</b>
            <br /><br />
            <a href="../games.html" style="color: #00ffff"><< BACK TO GAMES</a>
        </div>

        <script src="roullete_wheel.js"></script>
        <script src="../cursor.js"></script>
        <script src="../global_ui.js"></script>
    </body>
</html>
