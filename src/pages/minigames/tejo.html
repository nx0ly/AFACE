<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Tejo</title>
        <style>
            /* 2000s Retro Styles */
            body {
                background-color: var(--color-brown, #684d3a);
                margin: 0;
                padding: 0;
                overflow: hidden;
            }
            #canvas {
                width: 100vw;
                height: 100vh;
                display: block;
                border: none;
                cursor: crosshair;
            }
            /* Falling Arepas Animation */
            .falling-arepa {
                position: fixed;
                top: -100px;
                width: 64px;
                height: 64px;
                background-image: url('/images/arepa.png');
                background-size: cover;
                animation: fall linear infinite;
                z-index: 10;
                pointer-events: none;
                image-rendering: pixelated;
            }
            @keyframes fall {
                0% { transform: translateY(-100px) rotate(0deg); }
                100% { transform: translateY(110vh) rotate(360deg); }
            }
            #retro-title {
                position: fixed;
                top: 20%;
                width: 100%;
                z-index: 20;
                color: red;
                font-family: "Comic Sans MS", "Arial Black", sans-serif;
                font-size: 100px;
                font-weight: bold;
                text-align: center;
                pointer-events: none;
                text-shadow: 5px 5px 0 yellow, -5px -5px 0 blue;
                animation: blinker 0.2s linear infinite;
            }
            @keyframes blinker {
                50% { opacity: 0; }
            }
            #retro-back {
                position: fixed;
                bottom: 10px;
                left: 10px;
                z-index: 30;
                color: #00ffff;
                font-family: "Courier New", Courier, monospace;
                font-size: 20px;
                font-weight: bold;
                text-decoration: underline;
                background: rgba(0,0,0,0.5);
                padding: 5px;
            }
            /* Retry button — only shown after a throw lands */
            #retry-btn {
                position: fixed;
                top: 55%;
                left: 50%;
                transform: translate(-50%, -50%);
                z-index: 40;
                display: none;
                padding: 16px 42px;
                font-family: "Comic Sans MS", "Arial Black", sans-serif;
                font-size: 34px;
                font-weight: bold;
                color: #2a1a00;
                background: #ffe600;
                border: 5px outset #fff700;
                border-radius: 8px;
                cursor: pointer;
                box-shadow: 5px 5px 0 rgba(0,0,0,.6);
                letter-spacing: 1px;
                animation: retry-pulse 0.8s ease-in-out infinite;
            }
            #retry-btn:hover {
                background: #fff700;
            }
            #retry-btn:active {
                border-style: inset;
            }
            @keyframes retry-pulse {
                0%, 100% { transform: translate(-50%, -50%) scale(1); }
                50%      { transform: translate(-50%, -50%) scale(1.06); }
            }
        </style>
    </head>

    <body>
        <marquee id="retro-title" scrollamount="30">!!! TEJO !!! TEJO !!! TEJO !!!</marquee>
        <a id="retro-back" href="../games.html"><< BACK</a>

        <div class="falling-arepa" style="left: 5%; animation-duration: 4s; animation-delay: 0s;"></div>
        <div class="falling-arepa" style="left: 15%; animation-duration: 5s; animation-delay: 1s;"></div>
        <div class="falling-arepa" style="left: 10%; animation-duration: 3.5s; animation-delay: 2.5s;"></div>
        <div class="falling-arepa" style="right: 5%; animation-duration: 4.5s; animation-delay: 0.5s;"></div>
        <div class="falling-arepa" style="right: 15%; animation-duration: 3.8s; animation-delay: 1.5s;"></div>
        <div class="falling-arepa" style="right: 10%; animation-duration: 5.2s; animation-delay: 3s;"></div>

        <button id="retry-btn" type="button">⟳ REINTENTAR</button>

        <canvas
            id="canvas"
            width="1200"
            height="650"
        ></canvas>

        <script src="tejo.js"></script>
    </body>
</html>
