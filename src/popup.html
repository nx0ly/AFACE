<!doctype html>
<html lang="en" class="scheme-light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Pause</title>
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body class="w-[260px] bg-cream font-sans text-brown">
    <main class="p-[18px]">
      <p id="status" class="mb-[14px] leading-[1.4]">
        Clear every temporary site whitelist.
      </p>
      <button
        id="clear-whitelist"
        type="button"
        class="btn rounded-[10px] px-[14px] py-[11px]"
      >
        Clear whitelist
      </button>

      <hr class="my-[14px] border-0 border-t-2 border-brown/20" />

      <p id="punishment-status" class="mb-[14px] leading-[1.4]">
        Cancel any punishment waiting on this site.
      </p>
      <button
        id="clear-punishments"
        type="button"
        class="btn rounded-[10px] px-[14px] py-[11px]"
      >
        Clear punishments here
      </button>

      <hr class="my-[14px] border-0 border-t-2 border-brown/20" />

      <p id="rig-status" class="mb-[10px] leading-[1.4]">
        Rig the next punishment on this site.
      </p>
      <select
        id="rig-pick"
        aria-label="Punishment to run"
        class="mb-[10px] w-full rounded-[10px] border-2 border-brown/40 bg-white p-[9px] font-sans text-[13px] font-bold text-brown"
      ></select>
      <button
        id="rig-run"
        type="button"
        class="btn rounded-[10px] px-[14px] py-[11px]"
      >
        Run it here
      </button>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
